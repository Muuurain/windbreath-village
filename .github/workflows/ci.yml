name: Godot CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  headless-test:
    name: Headless Test Suite & Asset Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Python scripts syntax
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile tools/process_nano_assets.py tools/generate_audio.py

      - name: Cache Godot 4.7.2 Linux Binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: .ci-godot
          key: godot-4.7.2-stable-linux-x86_64

      - name: Download Godot 4.7.2
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p .ci-godot
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q godot.zip -d .ci-godot
          chmod +x .ci-godot/Godot_v4.7.2-stable_linux.x86_64
          rm godot.zip

      - name: Import project resources (headless)
        run: |
          timeout 90s ./.ci-godot/Godot_v4.7.2-stable_linux.x86_64 --headless --import --path . || true

      - name: Run automated TestSuite
        run: |
          ./.ci-godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . "res://tests/test_runner.tscn"
