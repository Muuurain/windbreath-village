name: Bug Report
description: Report a gameplay, Android touch, or visual issue
labels: ["bug"]
body:
  - type: input
    id: platform
    attributes:
      label: Platform & Device
      placeholder: "e.g. Android 15 (Snapdragon) / Windows 11"
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
